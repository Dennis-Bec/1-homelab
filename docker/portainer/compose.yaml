services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/docker/data/portainer:/data
    networks:
      - portainer_network

networks:
  portainer_network:
    external: true
